    <style>
        :root {
            --bg: #0d0d0d;
            --accent: #ff66ff;

        body {
            background-color: var(--bg);

            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            text-align: center;
            padding-top: 90px; 
        }

        /* --- STICKY NAVIGATION BAR --- */
        nav.main-nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(13, 13, 13, 0.95);
            backdrop-filter: blur(10px); 
            padding-top: 15px;
            padding-bottom: 0;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 40px;
            list-style: none;
            padding: 0 0 15px 0;
        }

        .nav-container li {
            display: inline;
        }

        .nav-container a {
            color: var(--text);
            text-decoration: none;
            text-transform: uppercase;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.9rem;
            letter-spacing: 2px;
            transition: 0.2s;
            opacity: 0.7;
        }

        .nav-container a:hover, .nav-container a.active {
            color: var(--accent);
            opacity: 1;
        }

        /* --- SKA CHECKERBOARD SEPARATOR --- */
        .ska-separator {
            height: 25px;
            width: 100%;
            background-image: 
                linear-gradient(45deg, #222 25%, transparent 25%), 
                linear-gradient(-45deg, #222 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #222 75%), 
                linear-gradient(-45deg, transparent 75%, #222 75%);
            background-color: #111;
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
            border: none;
        }

        .section-spacing-lg {
            margin-top: 80px;
        }

        /* --- CONTACT CONTENT --- */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            color: #d1d1d1;
            margin-bottom: 40px;
        }

        /* --- STYLED GOOGLE FORM CONTAINER --- */
        .form-frame {
            position: relative;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            padding: 5px; 
            background: linear-gradient(45deg, #222, var(--accent));
            box-shadow: 0 0 30px rgba(255, 102, 255, 0.2);
        }

        .form-frame iframe {
            display: block;
            width: 100%;
            border: none;
            border-radius: 8px;
            background: #fff;
            min-height: 900px;
        }

        /* --- FOOTER --- */
        footer {
            margin-top: 0;
            padding: 0px 0px;
            text-align: center;
        }
        
        .copyright {
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .nav-container { gap: 20px; }
            .nav-container a { font-size: 1.1rem; }
        }
    </style>
