<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: It's a SKAtastrophe! | Shawn DePasquale</title>
    
    <link rel="icon" type="image/png" href="./favicon.png">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://shawndepasquale.com/404.html">
    <meta property="og:title" content="404: It's a SKAtastrophe! | Shawn DePasquale">
    <meta property="og:description" content="You've skanked your way to a dead link. This page has ghosted you, rude boy.">
    <meta property="og:image" content="https://shawndepasquale.com/banner.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0d0d0d;
            --accent: #ff66ff; 
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- SKA CHECKERBOARD SEPARATOR --- */
        .ska-separator {
            height: 24px;
            width: 100%;
            background-image: 
                linear-gradient(45deg, #222 25%, transparent 25%), 
                linear-gradient(-45deg, #222 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #222 75%), 
                linear-gradient(-45deg, transparent 75%, #222 75%);
            background-color: #111;
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
            border: none;
        }

        /* --- WALT JABSCO SILHOUETTE --- */
        .walt-silhouette {
            position: fixed;
            left: 50px; 
            top: 50%;   
            transform: translateY(-50%); 
            width: auto;
            height: 70vh; 
            z-index: 1;
            pointer-events: none;
            opacity: 1; 
        }

        .walt-silhouette img {
            height: 100%;
            width: auto;
            display: block;
        }

        /* --- ERROR CONTAINER --- */
        .error-container {
            max-width: 700px;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
            margin-left: 150px; 
        }

        .error-code {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 10rem;
            font-weight: 400;
            margin: 0;
            color: #1a1a1a;
            position: relative;
            line-height: 1;
            letter-spacing: 10px;
            user-select: none; 
        }

        /* Glitch Effect on the Overlay Text */
        .error-code::after {
            content: "404";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            color: var(--accent);
            text-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent);
            animation: glitch 4s infinite;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-top: 30px;
            margin-bottom: 20px;
            color: #fff;
        }

        p {
            font-size: 1.2rem;
            color: #bbb;
            margin-bottom: 50px;
            line-height: 1.7;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- SKA BUTTON (Checkerboard Treatment) --- */
        .back-btn {
            display: inline-block;
            padding: 15px 50px;
            text-decoration: none;
            text-transform: uppercase;
            font-family: 'Bebas Neue', sans-serif;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 1.4rem;
            border-radius: 6px;
            transition: 0.2s;
            color: #fff;
            border: 2px solid #fff;
            
            /* Dark Checkerboard Pattern Background */
            background-color: #000;
            background-image: 
                linear-gradient(45deg, #222 25%, transparent 25%), 
                linear-gradient(-45deg, #222 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #222 75%), 
                linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 10px 10px; /* Small, subtle pattern */
            background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px rgba(255, 255, 255, 0.2);
        }

        @keyframes glitch {
            0% { transform: translateX(-50%) skew(0deg); }
            2% { transform: translateX(-52%) skew(5deg); }
            4% { transform: translateX(-48%) skew(-5deg); }
            6% { transform: translateX(-50%) skew(0deg); }
            100% { transform: translateX(-50%) skew(0deg); }
        }

        .ska-note {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #444;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .error-code { font-size: 6rem; }
            h1 { font-size: 2rem; }
            .walt-silhouette { 
                height: 40vh; 
                left: -40px; 
                top: auto;   
                bottom: 20px; 
                transform: none; 
                opacity: 0.3; 
            }
            .error-container { margin-left: 0; } 
            .ska-note { font-size: 0.7rem; bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="ska-separator"></div>
    <div class="ska-separator bottom"></div>

    <div class="walt-silhouette">
        <img src="walt-jabsco.jpg" alt="" aria-hidden="true">
    </div>

    <div class="error-container">
        <div class="error-code" aria-label="Error 404">404</div>
        
        <h1>It's a SKAtastrophe!</h1>
        <p>
            You've skanked your way to a dead link. This page has ghosted you, rude boy. Pick it up, pick it up, and head back to safety.
        </p>
        
        <a href="/" class="back-btn">Return Home</a>
    </div>

    <div class="ska-note">Pick it up, pick it up, pick it up!</div>

</body>
</html>
