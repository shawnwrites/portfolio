<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: Roll for Initiative | Shawn DePasquale</title>
    
    <link rel="icon" type="image/png" href="./favicon.png">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://shawndepasquale.com/404.html">
    <meta property="og:title" content="404: Page Not Found | Shawn DePasquale">
    <meta property="og:description" content="This page doesn't exist. You rolled a Nat 1. Return to the portfolio.">
    <meta property="og:image" content="https://shawndepasquale.com/banner.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0d0d0d;
            --accent: #ff66ff; 
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- SKA CHECKERBOARD DECORATION --- */
        .ska-separator {
            position: fixed;
            top: 0;
            height: 15px;
            width: 100%;
            background-image: 
                linear-gradient(45deg, #222 25%, transparent 25%), 
                linear-gradient(-45deg, #222 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #222 75%), 
                linear-gradient(-45deg, transparent 75%, #222 75%);
            background-color: #111;
            background-size: 15px 15px;
            background-position: 0 0, 0 7.5px, 7.5px -7.5px, -7.5px 0px;
            border-bottom: 1px solid #333;
            z-index: 100;
        }

        .ska-separator.bottom {
            top: auto;
            bottom: 0;
            border-bottom: none;
            border-top: 1px solid #333;
        }

        /* --- WALT JABSCO SILHOUETTE --- */
        .walt-silhouette {
            position: fixed;
            left: 20px; /* Positioned on the LEFT */
            bottom: 0px; /* Anchored to bottom */
            width: auto;
            height: 85vh; /* Takes up 85% of screen height */
            z-index: 1;
            pointer-events: none;
            opacity: 0.8; /* High visibility */
            /* Mix-blend-mode helps the black parts of the JPG blend if needed, 
               but since we are using filters, normal is fine. */
        }

        .walt-silhouette img {
            height: 100%;
            width: auto;
            display: block;
            /* Since the image is Black on White, we invert it to make the figure White on Dark */
            filter: invert(1); 
        }

        /* --- ERROR CONTAINER --- */
        .error-container {
            max-width: 700px;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
            /* Push content slightly right so it doesn't overlap Walt on desktop */
            margin-left: 150px; 
        }

        .error-code {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 10rem;
            font-weight: 400;
            margin: 0;
            color: #1a1a1a;
            position: relative;
            line-height: 1;
            letter-spacing: 10px;
            user-select: none; 
        }

        /* Glitch Effect on the Overlay Text */
        .error-code::after {
            content: "404";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            color: var(--accent);
            text-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent);
            animation: glitch 4s infinite;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-top: 30px;
            margin-bottom: 20px;
            color: #fff;
        }

        p {
            font-size: 1.2rem;
            color: #bbb;
            margin-bottom: 50px;
            line-height: 1.7;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .back-btn {
            display: inline-block;
            padding: 15px 40px;
            border: 2px solid #333;
            color: var(--text);
            background: #000;
            text-decoration: none;
            text-transform: uppercase;
            font-family: 'Bebas Neue', sans-serif;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 1.2rem;
            border-radius: 5px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px #fff;
        }

        @keyframes glitch {
            0% { transform: translateX(-50%) skew(0deg); }
            2% { transform: translateX(-52%) skew(5deg); }
            4% { transform: translateX(-48%) skew(-5deg); }
            6% { transform: translateX(-50%) skew(0deg); }
            100% { transform: translateX(-50%) skew(0deg); }
        }

        .ska-note {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #444;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .error-code { font-size: 6rem; }
            h1 { font-size: 2rem; }
            .walt-silhouette { 
                height: 40vh; /* Smaller on mobile */
                left: -20px; /* Pull him slightly off screen */
                bottom: 20px;
                opacity: 0.15; /* More faded on mobile so text is readable over him */
            }
            .error-container { margin-left: 0; } /* Center text on mobile */
            .ska-note { font-size: 0.7rem; bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="ska-separator"></div>
    <div class="ska-separator bottom"></div>

    <div class="walt-silhouette">
        <img src="walt-jabsco.jpg" alt="" aria-hidden="true">
    </div>

    <div class="error-container">
        <div class="error-code" aria-label="Error 404">404</div>
        
        <h1>Critical Failure!</h1>
        <p>
            You rolled a Nat 1 on your navigation check. This page has been blinked out of existence or moved to a different reality.
        </p>
        
        <a href="index.html" class="back-btn">Return to Safety</a>
    </div>

    <div class="ska-note">Pick it up, pick it up, pick it up!</div>

</body>
</html>
